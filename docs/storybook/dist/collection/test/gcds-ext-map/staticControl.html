<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>staticControl.html</title>
    <script type="module" src="/build/gcds-ext-map.esm.js"></script>
    <style>
      html,
      body {
        height: 100%;
      }
      * {
        margin: 0;
        padding: 0;
      }
      gcds-ext-map:defined {
        max-width: 100%;
        width: 100%;
        height: 100%;
        border: none;
        vertical-align: middle;
      }
      gcds-ext-map:not(:defined) > * {
        display: none;
      }
      map-layer {
        display: none;
      }
    </style>
  </head>
  <body>
    <gcds-ext-map
      projection="CBMTILE"
      zoom="2"
      lat="45"
      lon="-90"
      controls
      controlslist="static"
    >
      <map-layer label="CBMT" src="/test/data/tiles/cbmt/cbmt.mapml" checked></map-layer>
    </gcds-ext-map>
  </body>
</html>
